[project]
name = "alloy-opt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanav T", email = "tanavt21@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.17",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "ucimlrepo>=0.0.7",
    "uvicorn>=0.54.0",
]

[project.scripts]
alloy-opt = "alloy_opt:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
